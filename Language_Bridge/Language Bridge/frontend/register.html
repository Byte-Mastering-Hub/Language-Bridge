<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Bridge ✦ Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-orb">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
        <div class="orb-3"></div>
    </div>
    <div class="grid-overlay"></div>

    <!-- Register Container -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join global conversations today</p>
            
            <form id="register-form">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" class="input-field" placeholder="Username" id="register-username" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" class="input-field" placeholder="Email address" id="register-email" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="input-field" placeholder="Password" id="register-password" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="input-field" placeholder="Confirm Password" id="register-confirm" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-globe input-icon"></i>
                    <select class="select-field" id="register-language">
                        <option value="en">🇬🇧 English</option>
                        <option value="ja">🇯🇵 日本語 (Japanese)</option>
                        <option value="ko">🇰🇷 한국어 (Korean)</option>
                        <option value="es">🇪🇸 Español (Spanish)</option>
                        <option value="fr">🇫🇷 Français (French)</option>
                        <option value="de">🇩🇪 Deutsch (German)</option>
                        <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
                        <option value="ar">🇸🇦 العربية (Arabic)</option>
                        <option value="zh">🇨🇳 中文 (Chinese)</option>
                    </select>
                    <i class="fas fa-chevron-down select-arrow"></i>
                </div>
                
                <button type="submit" class="btn-primary">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>
            
            <p class="switch-text">
                Already have an account? 
                <a href="index.html" class="switch-link">Sign in</a>
            </p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-stack"></div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script type="module" src="firebase.js"></script>
    <script src="auth.js"></script>
</body>
</html>
